[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    "ignore::DeprecationWarning:fastapi.testclient",
    "ignore::FutureWarning:pyspark",
]

[tool.ruff]
target-version = "py312"
line-length = 110
exclude = [".venv", "__pycache__", ".pytest_cache"]

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/benchmark_compare.py" = ["E402"]
"dashboard/streamlit_app.py" = ["E402"]
